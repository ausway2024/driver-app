name: driver_modual
description: "AUSWAY Driver Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.3 <4.0.0"

dependencies:
  socket_io_client: ^3.1.2
  supabase_flutter: ^2.8.0
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ==============================
  # Existing Packages
  # ==============================
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  google_maps_flutter: ^2.5.0

  # ==============================
  # Backend Integration
  # ==============================
  http: ^1.2.1
  shared_preferences: ^2.2.2

  # ==============================
  # Google Maps & Location
  # ==============================
  geolocator: ^11.0.0
  permission_handler: ^11.3.1
  flutter_polyline_points: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/AUSWAY LOGO 1.png
    - assets/e911_emergency.png
    - assets/quick_reorder.png

    